name: Provider drift

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.6.2

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate sanitized fixtures and selector contracts
        run: |
          node scripts/check-provider-drift.mjs --report
          pnpm exec vitest run tests/unit/adapters/provider-contracts.test.ts

      - name: Upload provider drift report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: provider-drift-report
          path: qa-artifacts/provider-drift-report.json
          if-no-files-found: warn
